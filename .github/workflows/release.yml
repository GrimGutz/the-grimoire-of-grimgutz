name: Release

# Push a tag v<version> matching module.json (npm run bump -- <version> first).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Fails if the tag and module.json version differ.
      - run: npm run release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/module.json dist/module.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      # Lists the version on foundryvtt.com when the repository secret
      # FOUNDRY_RELEASE_TOKEN holds the package's release token; skipped otherwise.
      - name: Publish to foundryvtt.com
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: node tools/foundry-release.mjs
