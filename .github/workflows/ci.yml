name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Formatting, lint, tests, pack build from src/ and the validator. No Foundry
      # install exists here, so core-icon and version-drift checks only warn.
      - run: npm run check
      - run: npm run release
